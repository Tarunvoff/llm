experiment:
  name: "qwen3_4b_qlora_sft"
  description: "QLoRA SFT of Qwen3-4B-Instruct for pedagogical Socratic dialogue"
  seed: 42
  tracking:
    use_mlflow: false
    experiment_name: "pedagogical_tutor_sft"

model:
  name: "Qwen/Qwen3-4B-Instruct-2507"
  revision: "main"
  torch_dtype: "bfloat16"
  use_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  use_nested_quant: false
  device_map: "auto"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

data:
  train_file: "data/sft/train.jsonl"
  validation_file: "data/sft/validation.jsonl"
  max_seq_length: 2048
  dataset_text_field: "text"

training:
  output_dir: "outputs/qwen3_4b_sft"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 3
  bf16: true
  fp16: false
  report_to: "none"
